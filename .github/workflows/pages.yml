name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened, edited, deleted, labeled, unlabeled, closed, reopened, transferred]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install enhancements dependencies
        run: npm --prefix enhancements install --no-audit --no-fund
      - name: Prepare static website
        run: |
          mkdir -p _site
          set -eu
          cp index.html ./*.css ./*.js music.mp3 _site/
          cp -R assets _site/assets
          mkdir -p enhancements/src/upgrades
          cp reactbits/*.jsx reactbits/*.css enhancements/src/upgrades/
          if grep -nE 'getUserMedia|navigator\.mediaDevices' enhancements/src/upgrades/*.jsx; then exit 1; fi
          cd enhancements
          npx --yes shadcn@latest add @reactbits-starter/glitch-text-tw --yes --overwrite
          cd ..
          npm --prefix enhancements run build
          touch _site/.nojekyll
          for file in _site/*.js; do node --check "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          root = Path('_site')
          class Check(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  url = a.get('src') if tag in ('script', 'img', 'audio', 'source') else a.get('href') if tag == 'link' and a.get('rel') == 'stylesheet' else None
                  if not url: return
                  p = urlsplit(url)
                  if not p.scheme and not p.netloc and p.path and not (root / p.path.lstrip('/')).is_file():
                      raise SystemExit('Missing published asset: ' + url)
          Check().feed((root / 'index.html').read_text())
          for name in ('assets/character-cutout.svg', 'assets/card-art-preview.svg', 'assets/profile-qr.svg', 'experience-v2.js', 'effects-v2.js', 'elastic-mesh-site.js', 'character-reveal.js'):
              if not (root / name).is_file(): raise SystemExit('Missing feature: ' + name)
          PY
      - name: Generate automatically moderated reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BLOCKLIST: ${{ secrets.REVIEW_BLOCKLIST }}
        run: python3 .github/scripts/filter_reviews.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

